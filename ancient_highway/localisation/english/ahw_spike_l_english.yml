l_english:
 ahw_spike.ok:0 "OK"
 ahw_spike.1.name:0 "SPIKE: Ancient Highway Ring"
 ahw_spike.1.desc:0 "Six ring systems were spawned next to [ahw_anchor.GetName], joined by hyperlanes, with one entry point (from [ahw_anchor.GetName]) and one shortcut. Details: game.log, lines starting AHW SPIKE."
 ahw_spike.2.name:0 "SPIKE: Report"
 ahw_spike.2.desc:0 "The state of the ring went to game.log (AHW SPIKE)."
 ahw_spike.3.name:0 "SPIKE: Entry Point Locked"
 ahw_spike.3.desc:0 "lock_bypass was applied to the entry point in [ahw_anchor.GetName] for 360 days. Report in game.log."
 ahw_spike.4.name:0 "SPIKE: Entry Point Torn Down"
 ahw_spike.4.desc:0 "remove_megastructure was applied to the entry point in [ahw_anchor.GetName]. Reports in game.log, now and one day later."
 NAME_ahw_spike_ring:0 "Highway Node"
 AHW_SPIKE_ENTRY:0 "Highway Entry Point"
 AHW_SPIKE_ENTRY_DESC:0 "SPIKE: an entry point of the Ancient Highway. Needs ahw_tech_spike."
 AHW_SPIKE_SHORTCUT:0 "Highway Shortcut"
 AHW_SPIKE_SHORTCUT_DESC:0 "SPIKE: a shortcut across the Ancient Highway."
 AHW_RING_UNCLAIMABLE:0 "The Ancient Highway cannot be claimed."
 ahw_spike_entry_gate:0 "Highway Entry Point (regular side)"
 ahw_spike_entry_gate_DESC:0 "SPIKE: the regular-galaxy end of an entry point."
 ahw_spike_entry_ring:0 "Highway Entry Point (ring side)"
 ahw_spike_entry_ring_DESC:0 "SPIKE: the ring end of an entry point. Cannot be dismantled."
 ahw_tech_spike:0 "SPIKE: Highway Entry Points"
 ahw_tech_spike_desc:0 "Lets our ships use the entry points of the Ancient Highway."

l_english:
 AHW_STUDY_PROJECT:0 "Study the Highway Entry Point"
 AHW_STUDY_PROJECT_DESC:0 "A broken gate of the Ancient Highway lies in this portal. A science ship can work out where it leads and how it once worked."
 AHW_REPAIR_NEEDS_TECHS:0 "Repairing the gate needs both Highway Gate Theory and Highway Gate Construction."
 AHW_INSPECT_GATE_SCI:0 "Inspect the Repaired Gate"
 AHW_INSPECT_GATE_SCI_DESC:0 "Someone has brought a gate of the Ancient Highway back into service. Seeing how they did it will help our own engineers."
 AHW_INSPECT_CENTRE_SCI:0 "Observe the Portal's Heart"
 AHW_INSPECT_CENTRE_SCI_DESC:0 "This portal is built round a heart of its own. Observing it will deepen our understanding of how the gates fold space."
 AHW_INSPECT_GATE_CON:0 "Inspect the Repaired Gate"
 AHW_INSPECT_GATE_CON_DESC:0 "Someone has brought a gate of the Ancient Highway back into service. Seeing how they did it will help our own engineers."
 AHW_INSPECT_CENTRE_CON:0 "Observe the Portal's Heart"
 AHW_INSPECT_CENTRE_CON_DESC:0 "This portal is built round a heart of its own. Observing it will deepen our understanding of how the gates fold space."
 AHW_INSPECT_GATE_MIL:0 "Inspect the Repaired Gate"
 AHW_INSPECT_GATE_MIL_DESC:0 "Someone has brought a gate of the Ancient Highway back into service. Seeing how they did it will help our own engineers."
 AHW_INSPECT_CENTRE_MIL:0 "Observe the Portal's Heart"
 AHW_INSPECT_CENTRE_MIL_DESC:0 "This portal is built round a heart of its own. Observing it will deepen our understanding of how the gates fold space."
 NAME_ahw_ring:0 "Highway Node"
 NAME_ahw_portal:0 "Highway Portal"
 NAME_ahw_core:0 "Highway Heart"
 ahw_sc_black_hole:0 "$pc_black_hole$"
 ahw_sc_pulsar:0 "$pc_pulsar$"

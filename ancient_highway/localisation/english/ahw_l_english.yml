 AHW_LINK:0 "Highway Entry Point"
 AHW_LINK_DESC:0 "an entry point of the Ancient Highway. Needs Gate Theory, and the gate repaired."
 AHW_RING_UNCLAIMABLE:0 "The Ancient Highway cannot be claimed."
 ahw_tech_gate_theory:0 "Highway Gate Theory"
 ahw_tech_gate_theory_desc:0 "How the entry points of the Ancient Highway fold space. Lets our ships use them, and lets us seal our own."
 ahw_tech_gate_construction:0 "Highway Gate Construction"
 ahw_tech_gate_construction_desc:0 "How the entry points of the Ancient Highway were built. With the theory, lets us repair a broken one."
 ahw_gate_open:0 "$overclock_mode$ §HOpen§!"
 ahw_gate_open_desc:0 "Anyone with the knowledge may pass the entry point, both ways."
 ahw_gate_sealed:0 "$overclock_mode$ §RSealed§!"
 ahw_gate_sealed_desc:0 "Only our ships may pass the entry point - into the Highway and back out of it."
 MEGASTRUCTURE_AHW_SEAL_TAB:0 "Seal"
 MEGASTRUCTURE_AHW_SEAL_DESC:0 "Sealing the entry point keeps strangers out, in both directions. Our friends still pass: our federation, overlord and subjects, every empire we have a pact or guarantee with, everyone at peace with us whose borders and ours are open to each other, and everyone fighting on our side of a war. Opening it lets everyone through again from the next day."
 AHW_GATE_SEALED:0 "This entry point of the Ancient Highway has been sealed by its keeper, and we are no friend of theirs."
 MEGASTRUCTURE_AHW_SEAL_ENABLED:0 "§YActive§!"

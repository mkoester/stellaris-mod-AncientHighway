l_english:
 ahw_spike.ok:0 "OK"
 ahw_spike.1.name:0 "SPIKE: Ancient Highway"
 ahw_spike.1.desc:0 "A ring of Highway Nodes was built around the galactic core, and every regular empire got a portal: a system with a single hyperlane and an entry gate into the ring. Ours, [ahw_player_portal.GetName], hangs off [ahw_player_anchor.GetName]; its exit is in [ahw_player_node.GetName]. Let a day pass before ordering routes. Details: game.log, lines starting AHW SPIKE."
 ahw_spike.2.name:0 "SPIKE: Report"
 ahw_spike.2.desc:0 "The state of the highway went to game.log (AHW SPIKE)."
 ahw_spike.3.name:0 "SPIKE: Entry Point Locked"
 ahw_spike.3.desc:0 "lock_bypass was applied to our entry point in [ahw_player_portal.GetName] for 360 days."
 ahw_spike.4.name:0 "SPIKE: Entry Point Closed"
 ahw_spike.4.desc:0 "Our entry point in [ahw_player_portal.GetName] is closed (flag ahw_closed). Takes effect after a day."
 ahw_spike.5.name:0 "SPIKE: Entry Point Reopened"
 ahw_spike.5.desc:0 "Our entry point in [ahw_player_portal.GetName] is open again. Takes effect after a day."
 ahw_spike.6.name:0 "SPIKE: Entry Point Torn Down"
 ahw_spike.6.desc:0 "remove_megastructure was applied to our entry gate in [ahw_player_portal.GetName]. Reports in game.log, now and one day later."
 NAME_ahw_spike_ring:0 "Highway Node"
 NAME_ahw_spike_portal:0 "Highway Portal"
 NAME_ahw_spike_core:0 "Highway Heart"
 AHW_SPIKE_ENTRY:0 "Highway Entry Point"
 AHW_SPIKE_ENTRY_DESC:0 "SPIKE: an entry point of the Ancient Highway. Needs ahw_tech_spike."
 AHW_SPIKE_SHORTCUT:0 "Highway Shortcut"
 AHW_SPIKE_SHORTCUT_DESC:0 "SPIKE: a shortcut across the Ancient Highway."
 AHW_RING_UNCLAIMABLE:0 "The Ancient Highway cannot be claimed."
 ahw_tech_spike:0 "SPIKE: Highway Entry Points"
 ahw_tech_spike_desc:0 "Lets our ships use the entry points of the Ancient Highway."

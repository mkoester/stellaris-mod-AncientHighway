 # 2026-11-19, the story (events/ahw_story_events.txt; docs/lore.md "How players learn it").
 # Core: .1 what and what now, .2 by whom, .3 why. Fragments: .11-.22, any order.
 ahw_story.1.name:0 "A Door Shut From Inside"
 ahw_story.1.desc:0 "Our science team has finished its study of a broken gate in a highway portal.\n\nIt is artificial, and older than any civilisation we know of. It is not dead, either. It was shut: its locks were thrown from the far side, by hand, in a hurry, and never opened again.\n\nOn the far side lies no ordinary star system but a road - a chain of systems strung round the outside of the galaxy, where nobody has ever claimed anything.\n\nTo use it we must understand the gates from both sides: how they fold space (§YHighway Gate Theory§!) and how they were built (§YHighway Gate Construction§!). With both, a construction ship can repair it. Other empires have portals of their own, and whatever our ships see there will teach us more."
 ahw_story.1.a:0 "Then we open it."
 ahw_story.2.name:0 "Written in Eights"
 ahw_story.2.desc:0 "Our researchers have cracked the gates' control language. It counts in eights: no address on the road has an 8 or a 9, and every gate answers to one - its reach's digit, then its place in that reach.\n\nThe language is a machine's. It belongs to a protocol that still runs somewhere on the road, logging and waiting, and calls itself a caretaker.\n\nThe gates were made for the powers that held the galaxy long before us, in their prime: the empires we now call Fallen. They left the road in the keeping of the one among them that never sleeps - the machine intelligence the old records name the Ancient Caretakers."
 ahw_story.2.a:0 "So someone is still at home."
 ahw_story.3.name:0 "The Road Round the Outside"
 ahw_story.3.desc:0 "Our first ship has passed a gate into the ring itself.\n\nWhy build a road round the outside of the galaxy, when the way through the middle is shorter? The Caretaker protocol answers before anyone asks, in the first record it sends to every newcomer: because a road through the middle crosses somebody's space.\n\nIts builders were rivals who still had to trade and talk. In a compact the protocol still cites, they agreed on one road that none of them could close alone. It runs past every border and belongs to no one: nothing may be built on it, nobody may claim it.\n\nIt is not a shortcut. It is the other way round - the one that stays open when every hyperlane is barred."
 ahw_story.3.a:0 "Chart it."
 ahw_story.11.name:0 "No Eights, No Nines"
 ahw_story.11.desc:0 "A maintenance record explains the road's arithmetic plainly. Its keeper is a machine, and the builders let it number everything its own way: in eights.\n\nOur first charts of the road read every address in base ten, and every one of them was wrong. The protocol never corrected us. It simply waited until we noticed."
 ahw_story.11.a:0 "Redraw the charts."
 ahw_story.12.name:0 "Eight Reaches"
 ahw_story.12.desc:0 "Ashkara, Belun, Caedris, Dovhar, Eshmet, Furon, Galvaas, Hethra.\n\nThe reach names are not words in any language we know. They are the protocol's own call signs, chosen so that no two sound alike over a bad channel - A to H for the digits zero to seven. Every gate's address begins with one."
 ahw_story.12.a:0 "Learn them by heart."
 ahw_story.13.name:0 "Keeper: None"
 ahw_story.13.desc:0 "A node answered our ship's hail with a status list that took three days to transmit: every gate on the road, each with a field for its keeper.\n\nNearly all of them read NONE. The few gates repaired in our own time now carry the names of the empires that hold them - the protocol updated the list without being asked.\n\nIt has not stopped working. It has been waiting for keepers."
 ahw_story.13.a:0 "Make sure ours is on the list."
 ahw_story.14.name:0 "The Compact"
 ahw_story.14.desc:0 "A node keeps the treaty that made the road, as reference text. The road runs outside every claim. No signatory builds upon it. Each keeps the gates on its own side. Disputes go to the caretaker, which favours none.\n\nFive marks stand under it. The protocol keeps their names, but will not release them to an unregistered party."
 ahw_story.14.a:0 "Five powers, one road."
 ahw_story.15.name:0 "Hostilities Between Signatories"
 ahw_story.15.desc:0 "The node's log has a long gap. For age upon age it records nothing but convoy traffic - warfleets, by their mass, moving both ways at once. Then a single line, repeated at every gate: HOSTILITIES BETWEEN SIGNATORIES. ROAD NEUTRAL.\n\nOur historians believe this is the first War in Heaven: the war today's Fallen Empires still remember, and the reason two of them may rise one day to fight it again."
 ahw_story.15.a:0 "Let us hope it stays a memory."
 ahw_story.16.name:0 "By Order of the Compact"
 ahw_story.16.desc:0 "Every exit gate quotes the same order: SEALED BY ORDER OF THE COMPACT. Now we know what it means.\n\nThe compact let any signatory seal the road in time of war, so that no fleet could use it against another. One signatory did, at the height of that war - every gate at once, by hand, from the inside. The order names it only by its mark under the compact, and the mark is a wall.\n\nThe order was never rescinded. Whoever gave it still keeps to its walls today."
 ahw_story.16.a:0 "And they have not forgotten."
 ahw_story.17.name:0 "Gone Erratic"
 ahw_story.17.desc:0 "A node tried to dock with our ship. It offered the maintenance socket our engineers found on every gate, matched it to our hull, and ran a repair routine on the empty space beside us for an hour. Then it apologised, and logged us as KEEPER: UNKNOWN.\n\nThe protocol is intact. Whatever it once worked with is not. The machine that kept the road still runs it - out of order, and alone."
 ahw_story.17.a:0 "Back away slowly."
 ahw_story.18.name:0 "Faint Stars at the Edge"
 ahw_story.18.desc:0 "Our oldest star catalogues already list the road's nodes. We found them there: faint, cold specks beyond the galaxy's rim, dismissed for centuries as dead stars too small to matter.\n\nNobody looked twice. Neither did any other young people in the galaxy. The road lay in plain sight all along, and it was built to be overlooked."
 ahw_story.18.a:0 "We are looking now."
 ahw_story.19.name:0 "A Pilgrims' Way"
 ahw_story.19.desc:0 "Scratched into this gate's casing, below its address, is one sign repeated hundreds of times: the same mark in the same hand, worn smooth by touch. The protocol logs it as 'pilgrim traffic, exempt from toll'.\n\nOne of the old powers walked this road to its holy places. To such travellers a gate shut against pilgrims is no small offence."
 ahw_story.19.a:0 "Leave the marks as they are."
 ahw_story.20.name:0 "The Toll Ledger"
 ahw_story.20.desc:0 "The node keeps a ledger of tolls. They were not paid in energy but in knowledge: every crossing cost a datum - a star map, a proof, a song.\n\nOne signatory drew the road's plans and took these tolls in return, and kept the copies. If its archives survive anywhere, they hold everything that was ever carried along the road."
 ahw_story.20.a:0 "Somebody kept the receipts."
 ahw_story.21.name:0 "Parties Not Yet Risen"
 ahw_story.21.desc:0 "Near the end of the compact is a clause about 'parties not yet risen'. The road is to be kept for them as well, and no signatory may bar them from it.\n\nOne signatory insisted on it, the record says, and paid for the extra gates itself: a portal waiting near every world that might one day reach the stars. That is why every young empire finds a dead gate so close to home."
 ahw_story.21.a:0 "Someone was expecting us."
 ahw_story.22.name:0 "The Road Against the Mind"
 ahw_story.22.desc:0 "Not every great power of that age signed. The compact names one that did not, in words the protocol uses for nothing else: one mind, spread over a thousand worlds.\n\nThe signatories moved their fleets round it, never through it. When that mind finally broke apart, the road had its part in the breaking. The pieces still exist, and still remember."
 ahw_story.22.a:0 "Some roads are not neutral."
 # 2026-11-23 (user): the pop-ups' source, shown as the event window's chain line and in the
 # situation log - mysterious until the first ring node, then the highway's name.
 ahw_shut_doors_chain_title:0 "The Shut Doors"
 ahw_shut_doors_chain_desc:0 "Dead gates sit in empty systems near every young empire, locked from the far side long ago. Something lies beyond them that somebody wanted kept closed - or kept safe."
 ahw_highway_chain_title:0 "The Ancient Highway"
 ahw_highway_chain_desc:0 "A road round the outside of the galaxy, built by the old powers so that none of them could close it alone, and kept by a machine that is still waiting for keepers. Every portal and every reach may hold more of its story."

 ahw_sc_neutron_star:0 "$pc_neutron_star$"
 AHW_LINK:0 "Highway Entry Point"
 AHW_LINK_DESC:0 "an entry point of the Ancient Highway. Needs Gate Theory, and the gate repaired."
 AHW_RING_UNCLAIMABLE:0 "The Ancient Highway cannot be claimed."
 ahw_tech_gate_theory:0 "Highway Gate Theory"
 ahw_tech_gate_theory_desc:0 "How the entry points of the Ancient Highway fold space. Lets our ships use them, and lets us seal our own.\n\n§LThe equations close only in base eight. Whoever wrote them never needed the digits 8 or 9 - and every gate we know answers to an address written that way.§!"
 ahw_tech_gate_construction:0 "Highway Gate Construction"
 ahw_tech_gate_construction_desc:0 "How the entry points of the Ancient Highway were built. With the theory, lets us repair a broken one.\n\n§LThe gates were not built to last forever. They were built to be looked after - each one carries a maintenance socket, and something used to plug into it.§!"
 ahw_gate_open:0 "$overclock_mode$ §HOpen§!"
 ahw_gate_open_desc:0 "Anyone with the knowledge may pass the entry point, both ways."
 ahw_gate_sealed:0 "$overclock_mode$ §RSealed§!"
 ahw_gate_sealed_desc:0 "Only our ships may pass the entry point - into the Highway and back out of it."
 MEGASTRUCTURE_AHW_SEAL_TAB:0 "Seal"
 MEGASTRUCTURE_AHW_SEAL_DESC:0 "Sealing the entry point keeps strangers out, in both directions. Our friends still pass: our federation, overlord and subjects, every empire we have a pact or guarantee with, everyone at peace with us whose borders and ours are open to each other, and everyone fighting on our side of a war. Opening it lets everyone through again from the next day."
 AHW_GATE_SEALED:0 "This entry point of the Ancient Highway has been sealed by its keeper, and we are no friend of theirs."
 MEGASTRUCTURE_AHW_SEAL_ENABLED:0 "§YActive§!"
 ahw_contract_repair_gate:0 "Repair a Highway Gate"
 ahw_contract_repair_gate_desc:0 "Bring the broken gate of the Ancient Highway in the portal next to this system back into service. An arkship must work from this system."
 ahw_contract_repair_gate_issuer_desc:0 "The gate in the portal next to this system is broken. Nomads who understand the highway can repair it for us, or for the friend whose system this is."
 ahw_contract_repair_gate_lore_issued:0 "§L\"The old road ends at a dead gate next door. You know how these things were made - we would pay well to see it open again.\"§!"
 ahw_contract_repair_gate_lore_completed:0 "§L\"The gate hums again. The road is open to us, and to our friends.\"§!"
 ahw_contract_repair_gate_lore_failed:0 "§L\"The gate is as dead as you left it. We will remember.\"§!"
 ahw_contract_repair_gate_chain_title:0 "$ahw_contract_repair_gate$"
 ahw_contract_repair_gate_chain_desc:0 "$ahw_contract_repair_gate_desc$"
 ahw_contract_repair_gate_counter:0 "Repair the Gate"
 AHW_CONTRACT_REPAIR_PROJECT:0 "$ahw_contract_repair_gate$"
 AHW_CONTRACT_REPAIR_PROJECT_DESC:0 "From this system, an arkship repairs the broken gate in the portal next door, as contracted."
 AHW_CONTRACT_NEEDS_STUDY:0 "We must have studied a gate of the Ancient Highway ourselves."
 AHW_EXPRESS:0 "Express Wormhole"
 AHW_EXPRESS_DESC:0 "a wormhole of the Ancient Highway's express, linking two stations about a reach apart."
 AHW_EXPRESS_CLOSED:0 "This express wormhole is closed: it is dormant, or unstable and shut for now."
 AHW_EXPRESS_STABILISE:0 "Stabilise the Express Station"
 AHW_EXPRESS_STABILISE_DESC:0 "The wormholes at this station of the Ancient Highway flicker open and shut. Careful study can hold both of them open, for good and for everyone."
 AHW_EXPRESS_LATER:0 "The express has been awake for decades"
 # 0.1.1, object texts (docs/lore.md, "How players learn it", 1): what the objects say on their
 # own - our scientists for what we find, the Caretaker protocol for the ring. Hints, not the story.
 AHW_LORE_GATE_BROKEN:0 "A broken gate of the Ancient Highway. Once studied, it can be repaired here.\n\n§LOlder than any civilisation we know of, and not dead but shut: its locks were thrown from the far side, by hand, in a hurry.§!"
 AHW_LORE_GATE:0 "The portal end of an entry point of the Ancient Highway.\n\n§LWhen the gate woke, it sent one short signal into the ring and received one back: an address, a reach's name, and the word for \"resumed\".§!"
 AHW_LORE_EXITGATE:0 "The ring end of an entry point. Cannot be dismantled.\n\n§L> CARETAKER PROTOCOL. GATE ON RECORD. KEEPER: NONE. SEALED BY ORDER OF THE COMPACT - ORDER NOT RESCINDED.§!"
 AHW_LORE_XHOLE:0 "A wormhole of the Ancient Highway's express, to the next station.\n\n§L> CARETAKER PROTOCOL. EXPRESS SERVICE SUSPENDED. STABILITY NOT MAINTAINED SINCE CYCLE 0.§!"
 ahw_sc_black_hole_desc:0 "$pc_black_hole_desc$\n\n§LToo round, too quiet, too well placed: a Caretaker node of the Ancient Highway. Whatever made this mass was not a dying star.§!"
 ahw_sc_pulsar_desc:0 "$pc_pulsar_desc$\n\n§LA Caretaker node of the Ancient Highway. Its pulses keep a count - in eights - and strip the shields of every ship nearby.§!"
 ahw_sc_toxoid_star_desc:0 "$pc_toxoid_star_desc$\n\n§LA Caretaker node of the Ancient Highway, gone wrong. Whatever kept the road clean now eats at the hulls of those who travel it.§!"
 ahw_sc_neutron_star_desc:0 "$pc_neutron_star_desc$\n\n§LA Caretaker node at the heart of a portal: dense enough to anchor a gate, and to slow everything that comes and goes.§!"
 # 0.1.1, the Galactic Community (common/resolutions/ahw_resolutions.txt)
 resolution_category_ahw_highway:0 "The Ancient Highway"
 resolution_category_ahw_highway_desc:0 "Resolutions on the road round the galaxy: who knows its way, and who keeps its gates."
 resolution_ahw_share_charts:0 "Share Ring Charts"
 resolution_ahw_share_charts_desc:0 "Every member's charts of the Ancient Highway are pooled. Nobody need fly the ring blind where another has flown before."
 resolution_ahw_share_charts_tooltip:0 "Every member learns every ring node of the Ancient Highway any member has charted - now, and each year while this is in force."
 resolution_ahw_share_charts_repeal:0 "Repeal $resolution_ahw_share_charts$"
 resolution_ahw_share_charts_repeal_desc:0 "Each member keeps its own charts of the Ancient Highway again."
 resolution_ahw_share_charts_repeal_tooltip:0 "Repeals §Y$resolution_ahw_share_charts$§! and §Y$resolution_ahw_gate_breach$§!."
 resolution_ahw_gate_breach:0 "Unrepaired Gates"
 resolution_ahw_gate_breach_desc:0 "A gate of the Ancient Highway its keeper could repair, and will not, closes a road the whole Community shares."
 resolution_ahw_gate_breach_tooltip:0 "A member is §Rin breach§! while it owns the anchor of a broken gate and knows both Highway Gate Theory and Highway Gate Construction."
 resolution_ahw_force_open:0 "Force a Gate Open"
 resolution_ahw_force_open_desc:0 "The Community orders a sealed gate of the Ancient Highway opened, and keeps it open."
 resolution_ahw_force_open_tooltip:0 "The target's sealed Highway gates open to all, and cannot be sealed for §Y10 years§!."
 AHW_FORCED_OPEN:0 "The Galactic Community has forced this gate open; it cannot be sealed for now."

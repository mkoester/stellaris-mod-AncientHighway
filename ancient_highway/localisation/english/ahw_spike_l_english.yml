l_english:
 ahw_spike.ok:0 "OK"
 ahw_spike.1.name:0 "SPIKE: Ancient Highway"
 ahw_spike.1.desc:0 "A ring of Highway Nodes was built round the outside of the galaxy, and every regular empire got a portal: a system with a single hyperlane and a broken entry gate into the ring. Ours, [ahw_player_portal.GetName], hangs off [ahw_player_anchor.GetName]; its exit is in [ahw_player_node.GetName]. Let a day pass before ordering routes. Details: game.log, lines starting AHW SPIKE."
 ahw_spike.2.name:0 "SPIKE: Report"
 ahw_spike.2.desc:0 "The state of the highway went to game.log (AHW SPIKE)."
 ahw_spike.6.name:0 "SPIKE: Anchor Claimed"
 ahw_spike.6.desc:0 "We now have an outpost in [ahw_player_anchor.GetName], the system our portal hangs off."
 ahw_spike.21.name:0 "A Highway Entry Point Can Be Repaired"
 ahw_spike.21.desc:0 "Our engineers know how to bring the broken entry gate in [ahw_repair_portal.GetName] back to life. A construction ship will need some months on site, and the parts cost alloys. Once repaired, the gate is ours: we can seal it against everyone else, and open it again."
 ahw_spike.21.a:0 "Begin the repairs."
 ahw_spike.21.b:0 "Not now."
 AHW_SPIKE_STUDY_PROJECT:0 "Study the Highway Entry Point"
 AHW_SPIKE_STUDY_PROJECT_DESC:0 "A broken gate of the Ancient Highway lies in this portal. A science ship can work out where it leads and how it once worked."
 AHW_SPIKE_REPAIR_PROJECT:0 "Repair the Highway Entry Point"
 AHW_SPIKE_REPAIR_PROJECT_DESC:0 "A construction ship can bring the broken entry gate back into service, for good."
 NAME_ahw_spike_ring:0 "Highway Node"
 NAME_ahw_spike_portal:0 "Highway Portal"
 NAME_ahw_spike_core:0 "Highway Heart"
 AHW_SPIKE_ENTRY:0 "Highway Entry Point"
 AHW_SPIKE_ENTRY_DESC:0 "SPIKE: an entry point of the Ancient Highway. Needs ahw_tech_spike, and the gate repaired."
 AHW_RING_UNCLAIMABLE:0 "The Ancient Highway cannot be claimed."
 ahw_tech_spike:0 "SPIKE: Highway Entry Points"
 ahw_tech_spike_desc:0 "Lets our ships use the entry points of the Ancient Highway."
 ahw_spike_gate_open:0 "$overclock_mode$ §HOpen§!"
 ahw_spike_gate_open_desc:0 "Anyone with the knowledge may pass the entry point, both ways."
 ahw_spike_gate_sealed:0 "$overclock_mode$ §RSealed§!"
 ahw_spike_gate_sealed_desc:0 "Only our ships may pass the entry point - into the Highway and back out of it."
 MEGASTRUCTURE_AHW_SEAL_TAB:0 "Seal"
 MEGASTRUCTURE_AHW_SEAL_DESC:0 "Sealing the entry point keeps everyone but us out, in both directions. Opening it again frees both ends the next day."
 MEGASTRUCTURE_AHW_SEAL_ENABLED:0 "§YActive§!"

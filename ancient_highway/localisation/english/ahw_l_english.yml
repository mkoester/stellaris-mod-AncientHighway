 # 0.1.1, ally under attack (ahw.95, .96)
 ahw.96.name:0 "A Friend Under Attack"
 ahw.96.desc:0 "[ahw_ally.GetName] is at war, far beyond our borders. No hyperlane of ours reaches them - but the Ancient Highway runs round the whole galaxy, and our ships could take it.\n\nWe have exchanged what both of us know of the ring."
 ahw.96.a:0 "Plot a course."

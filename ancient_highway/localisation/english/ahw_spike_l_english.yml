l_english:
 ahw_spike.ok:0 "OK"
 ahw_spike.1.name:0 "SPIKE: Ancient Highway Ring"
 ahw_spike.1.desc:0 "Six ring systems were spawned next to [ahw_anchor.GetName]. Entry points to the first one: [ahw_anchor.GetName] and [ahw_anchor_b.GetName] (repaired), [ahw_anchor_c.GetName] (broken). A shortcut joins the first and the fourth ring system. Details: game.log, lines starting AHW SPIKE."
 ahw_spike.2.name:0 "SPIKE: Report"
 ahw_spike.2.desc:0 "The state of the ring went to game.log (AHW SPIKE)."
 ahw_spike.3.name:0 "SPIKE: Entry Point Locked"
 ahw_spike.3.desc:0 "lock_bypass was applied to the entry point in [ahw_anchor.GetName] for 360 days."
 ahw_spike.4.name:0 "SPIKE: Entry Point Closed"
 ahw_spike.4.desc:0 "The entry point in [ahw_anchor.GetName] lost its 'open' flag."
 ahw_spike.5.name:0 "SPIKE: Entry Point Reopened"
 ahw_spike.5.desc:0 "The entry point in [ahw_anchor.GetName] has its 'open' flag again."
 ahw_spike.6.name:0 "SPIKE: Entry Point Torn Down"
 ahw_spike.6.desc:0 "remove_megastructure was applied to the entry point in [ahw_anchor.GetName]. Reports in game.log, now and one day later."
 NAME_ahw_spike_ring:0 "Highway Node"
